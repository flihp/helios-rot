[package]
name = "helios-rot"
version.workspace = true
edition.workspace = true
description = "a library crate implementing an interface to the Helios RoT"
license = "MPL-2.0"

[dependencies]
async-trait.workspace = true
der.workspace = true
getrandom.workspace = true
os-rot.workspace = true
p384 = { workspace = true, features = ["ecdsa", "ecdsa-core", "pem", "pkcs8", "std"] }
serde = { workspace = true, features = ["derive"] }
serde_with = { workspace = true, features = ["macros"] }
sled-agent-client = { workspace = true, optional = true }
sled-agent-types-versions = { workspace = true, optional = true }
slog.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["rt"] }
x509-cert = { workspace = true, default-features = true }

[build-dependencies]
anyhow.workspace = true
cfg-if.workspace = true
pki-playground = { workspace = true, optional = true }

[features]
sled-agent = ["sled-agent-client", "sled-agent-types-versions"]
unittest = ["pki-playground"]

[dev-dependencies]
helios-rot = { path = ".", features = ["unittest"] }
tokio = { workspace = true, features = ["macros", "rt"] }
